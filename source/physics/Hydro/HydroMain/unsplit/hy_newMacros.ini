; === sig allocation bounds ===
; Usage: @alloc_sig@  =>  sig(HY_VARINUMMAX,NDIM,loGC(IAXIS):hiGC(IAXIS),loGC(JAXIS):hiGC(JAXIS),loGC(KAXIS):hiGC(KAXIS))
alloc_sig
definition=
   sig(HY_VARINUMMAX,NDIM,loGC(IAXIS):hiGC(IAXIS),loGC(JAXIS):hiGC(JAXIS),loGC(KAXIS):hiGC(KAXIS))

; === lambda allocation bounds ===
; Usage: @alloc_lambda@  =>  lambda(HY_WAVENUM,NDIM,loGC(IAXIS):hiGC(IAXIS),loGC(JAXIS):hiGC(JAXIS),loGC(KAXIS):hiGC(KAXIS))
alloc_lambda
definition=
   lambda(HY_WAVENUM,NDIM,loGC(IAXIS):hiGC(IAXIS),loGC(JAXIS):hiGC(JAXIS),loGC(KAXIS):hiGC(KAXIS))

; === leftEig allocation bounds ===
