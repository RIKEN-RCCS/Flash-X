; === rghtEig allocation bounds ===
; Usage: @alloc_rghtEig@  =>  rghtEig(HY_VARINUM,HY_WAVENUM,NDIM,loGC(IAXIS):hiGC(IAXIS),loGC(JAXIS):hiGC(JAXIS),loGC(KAXIS):hiGC(KAXIS))
alloc_rghtEig
