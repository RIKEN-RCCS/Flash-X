; hy_getRiemannState.F90.ini
; Macros for array reference factorization
; Generated from hy_getRiemannState.F90

; === Parameterized shifted spatial index ===
; Expands i${di},j${dj},k${dk}
; Usage: @spc_s(+0,+0,+0)@  =>  i+0,j+0,k+0
;        @spc_s(-1,+0,+0)@  =>  i-1,j+0,k+0
spc_s
args=di,dj,dk
definition=
   i${di},j${dj},k${dk}

; === Single-variable field reference (4D arrays: arr(var,i,j,k)) ===
; Usage: @fld(U,DENS_VAR,+0,+0,+0)@  =>  U(DENS_VAR,i+0,j+0,k+0)
fld
args=arr,var,di,dj,dk
definition=
   ${arr}(${var},@spc_s(${di},${dj},${dk})@)

; === Range-variable field reference (4D arrays: arr(var_beg:var_end,i,j,k)) ===
; Usage: @fld_rng(U,VELX_VAR,VELZ_VAR,+0,+0,+0)@  =>  U(VELX_VAR:VELZ_VAR,i+0,j+0,k+0)
fld_rng
args=arr,var_beg,var_end,di,dj,dk
definition=
   ${arr}(${var_beg}:${var_end},@spc_s(${di},${dj},${dk})@)

; === Sig/characteristic variable reference (5D: sig(:,dir,i,j,k)) ===
; The first index is colon, second is a direction constant/variable
; Usage: @sig_ref(sig,DIR_Z,+0,+0,+0)@  =>  sig(:,DIR_Z,i+0,j+0,k+0)
;        @sig_ref(sig,DIR_Z,+0,-1,+0)@  =>  sig(:,DIR_Z,i+0,j-1,k+0)
sig_ref
args=sig_arr,dir,di,dj,dk
definition=
   ${sig_arr}(:,${dir},@spc_s(${di},${dj},${dk})@)

; === Lambda reference (5D: lambda(1,dir,i,j,k)) ===
; Usage: @lam_ref(lambda,DIR_Y,+0,+0,+0)@  =>  lambda(1,DIR_Y,i+0,j+0,k+0)
lam_ref
args=lam_arr,dir,di,dj,dk
definition=
   ${lam_arr}(1,${dir},@spc_s(${di},${dj},${dk})@)

; === Left eigenvector reference (6D: leftEig(1,1,dir,i,j,k)) ===
; Usage: @leig_ref(leftEig,DIR_Y,+0,+0,+0)@  =>  leftEig(1,1,DIR_Y,i+0,j+0,k+0)
leig_ref
args=eig_arr,dir,di,dj,dk
definition=
   ${eig_arr}(1,1,${dir},@spc_s(${di},${dj},${dk})@)

; === Right eigenvector reference (6D: rghtEig(1,1,dir,i,j,k)) ===
; Usage: @reig_ref(rghtEig,DIR_Y,+0,+0,+0)@  =>  rghtEig(1,1,DIR_Y,i+0,j+0,k+0)
reig_ref
args=eig_arr,dir,di,dj,dk
definition=
   ${eig_arr}(1,1,${dir},@spc_s(${di},${dj},${dk})@)

; === hy_SpcSig reference (5D: hy_SpcSig(:,i,j,k,dir)) ===
; Note: direction is the LAST index (different from sig)
; Usage: @spcsig_ref(hy_SpcSig,DIR_Z,+0,-1,+0)@  =>  hy_SpcSig(:,i+0,j-1,k+0,DIR_Z)
spcsig_ref
args=spc_arr,dir,di,dj,dk
definition=
   ${spc_arr}(:,@spc_s(${di},${dj},${dk})@,${dir})

; === hy_SpcR range reference (5D: hy_SpcR(1:HY_NSPEC,i,j,k,dir)) ===
; Usage: @spc_rng_ref(hy_SpcR,1,HY_NSPEC,DIR_X,+0,+0,+0)@  =>  hy_SpcR(1:HY_NSPEC,i+0,j+0,k+0,DIR_X)
spc_rng_ref
args=spc_arr,idx_beg,idx_end,dir,di,dj,dk
definition=
   ${spc_arr}(${idx_beg}:${idx_end},@spc_s(${di},${dj},${dk})@,${dir})

; === 3D spatial-only array reference (arr(i,j,k)) ===
; Usage: @spc3(DivU,+0,+0,+0)@  =>  DivU(i+0,j+0,k+0)
;        @spc3(BxStar,+1,+0,+0)@  =>  BxStar(i+1,j+0,k+0)
spc3
args=arr,di,dj,dk
definition=
   ${arr}(@spc_s(${di},${dj},${dk})@)

; === 3D array with direction prefix (arr(dir,i,j,k)) ===
; Usage: @spc3d(FlatTilde,dir,+0,+0,+0)@  =>  FlatTilde(dir,i+0,j+0,k+0)
;        @spc3d(FlatTilde,dir,+1,+0,+0)@  =>  FlatTilde(dir,i+1,j+0,k+0)
spc3d
args=arr,dir,di,dj,dk
definition=
   ${arr}(${dir},@spc_s(${di},${dj},${dk})@)

; === 1D array reference (arr(idx)) ===
; Usage: @spc1(xCenter,i)@  =>  xCenter(i)
;        @spc1(yCenter,j)@  =>  yCenter(j)
spc1
args=arr,idx
definition=
   ${arr}(${idx})

; === Sig array argument reference (sig(1,1,i,j,k)) ===
; Used when sig is passed as a subroutine argument starting at (1,1,i,j,k)
; Usage: @sig_arg(sig,+0,+0,+0)@  =>  sig(1,1,i+0,j+0,k+0)
sig_arg
args=arr,di,dj,dk
definition=
   ${arr}(1,1,@spc_s(${di},${dj},${dk})@)

; === Lambda array argument reference (lambda(1,1,i,j,k)) ===
; Usage: @lam_arg(lambda,+0,+0,+0)@  =>  lambda(1,1,i+0,j+0,k+0)
lam_arg
args=arr,di,dj,dk
definition=
   ${arr}(1,1,@spc_s(${di},${dj},${dk})@)

; === Left eigenvector array argument reference (leftEig(1,1,1,i,j,k)) ===
; Usage: @leig_arg(leftEig,+0,+0,+0)@  =>  leftEig(1,1,1,i+0,j+0,k+0)
leig_arg
args=arr,di,dj,dk
definition=
   ${arr}(1,1,1,@spc_s(${di},${dj},${dk})@)

; === Right eigenvector array argument reference (rghtEig(1,1,1,i,j,k)) ===
; Usage: @reig_arg(rghtEig,+0,+0,+0)@  =>  rghtEig(1,1,1,i+0,j+0,k+0)
reig_arg
args=arr,di,dj,dk
definition=
   ${arr}(1,1,1,@spc_s(${di},${dj},${dk})@)

; === Scratch array section with trailing colon (scrchFaceXPtr(VAR:,i,j,k)) ===
; Fortran section: first dimension from VAR to end, spatial indices i,j,k
; Usage: @scrch_section(scrchFaceXPtr,HY_N01_FACEXPTR_VAR,+0,+0,+0)@
;     =>  scrchFaceXPtr(HY_N01_FACEXPTR_VAR:,i+0,j+0,k+0)
scrch_section
args=arr,var,di,dj,dk
definition=
   ${arr}(${var}:,@spc_s(${di},${dj},${dk})@)

; === Species pointer section (spcL(:,i,j,k,iDir)) ===
; 5D array with colon first index, then spatial, then direction last
; Usage: @spc_section(hy_SpcL,iDir,+0,+0,+0)@  =>  hy_SpcL(:,i+0,j+0,k+0,iDir)
; Note: iDir is a variable, not a compile-time constant
spc_section
args=arr,dir,di,dj,dk
definition=
   ${arr}(:,@spc_s(${di},${dj},${dk})@,${dir})

; === Slice spatial index (i-lo:i+hi, j-lo:j+hi, k-lo:k+hi) ===
; Usage: @spc_slice(-1,+1,+0,+0,+0,+0)@  =>  i-1:i+1,j+0:j+0,k+0:k+0
; For single-element slices, use same lo and hi (e.g., +0,+0 for no shift)
spc_slice
args=dil,dih,djl,djh,dkl,dkh
definition=
   i${dil}:i${dih},j${djl}:j${djh},k${dkl}:k${dkh}

; === Field slice reference (4D: arr(var, i-lo:i+hi, j-lo:j+hi, k-lo:k+hi)) ===
; Usage: @fld_slice(U,BDRY_VAR,-1,+1,-1,+1,-1,+1)@
;     =>  U(BDRY_VAR,i-1:i+1,j-1:j+1,k-1:k+1)
fld_slice
args=arr,var,dil,dih,djl,djh,dkl,dkh
definition=
   ${arr}(${var},@spc_slice(${dil},${dih},${djl},${djh},${dkl},${dkh})@)

; === Variable-bound slice (im2:ip2, jm2:jp2, km2:kp2) ===
; For slices with variable name bounds
; Usage: @spc_slice_v(im2,ip2,jm2,jp2,km2,kp2)@  =>  im2:ip2,jm2:jp2,km2:kp2
spc_slice_v
args=il,ih,jl,jh,kl,kh
definition=
   ${il}:${ih},${jl}:${jh},${kl}:${kh}

; === Field variable-bound slice (4D: arr(var, il:ih, jl:jh, kl:kh)) ===
; Usage: @fld_slice_v(U,BDRY_VAR,im2,ip2,jm2,jp2,km2,kp2)@
;     =>  U(BDRY_VAR,im2:ip2,jm2:jp2,km2:kp2)
fld_slice_v
args=arr,var,il,ih,jl,jh,kl,kh
definition=
   ${arr}(${var},@spc_slice_v(${il},${ih},${jl},${jh},${kl},${kh})@)


; === 1D transverse flux array (single index) ===
; Usage: @tf1(TransFluxYZ,HY_MAGX)@  =>  TransFluxYZ(HY_MAGX)
;        @tf1(TransFluxZY,1)@  =>  TransFluxZY(1)
tf1
args=arr,idx
definition=
   ${arr}(${idx})

; === 1D transverse flux array (range) ===
; Usage: @tf_rng(TransFluxYZ,HY_DENS,HY_END_VARS-kGrav)@  =>  TransFluxYZ(HY_DENS:HY_END_VARS-kGrav)
tf_rng
args=arr,beg,end
definition=
   ${arr}(${beg}:${end})

; === Vc 1D range ===
; Usage: @vc_rng(HY_DENS,HY_END_VARS-kGrav)@  =>  Vc(HY_DENS:HY_END_VARS-kGrav)
vc_rng
args=beg,end
definition=
   Vc(${beg}:${end})

; === Wn 2D (single var, dir) ===
; Usage: @wn_ref(HY_DENS,DIRS)@  =>  Wn(HY_DENS,DIRS)
;        @wn_ref(HY_VELX,DIR_X)@  =>  Wn(HY_VELX,DIR_X)
wn_ref
args=var,dir
definition=
   Wn(${var},${dir})

; === Wp 2D (single var, dir) ===
; Usage: @wp_ref(HY_DENS,DIRS)@  =>  Wp(HY_DENS,DIRS)
;        @wp_ref(HY_VELX,DIR_X)@  =>  Wp(HY_VELX,DIR_X)
wp_ref
args=var,dir
definition=
   Wp(${var},${dir})

; === Wn 2D (range var, dir) ===
; Usage: @wn_rng_ref(HY_DENS,HY_END_VARS-kGrav,DIR_X)@  =>  Wn(HY_DENS:HY_END_VARS-kGrav,DIR_X)
wn_rng_ref
args=beg,end,dir
definition=
   Wn(${beg}:${end},${dir})

; === Wp 2D (range var, dir) ===
; Usage: @wp_rng_ref(HY_DENS,HY_END_VARS-kGrav,DIR_X)@  =>  Wp(HY_DENS:HY_END_VARS-kGrav,DIR_X)
wp_rng_ref
args=beg,end,dir
definition=
   Wp(${beg}:${end},${dir})

; === Wn section (first dim as :, fixed dir) ===
; Usage: @wn_section(DIR_X)@  =>  Wn(:,DIR_X)
;        @wn_section(iDim)@  =>  Wn(:,iDim)
wn_section
args=dir
definition=
   Wn(:,${dir})

; === Wp section (first dim as :, fixed dir) ===
; Usage: @wp_section(DIR_X)@  =>  Wp(:,DIR_X)
;        @wp_section(iDim)@  =>  Wp(:,iDim)
wp_section
args=dir
definition=
   Wp(:,${dir})

; === blkLimits reference ===
; Usage: @blk_ref(LOW,IAXIS)@  =>  blkLimits(LOW,IAXIS)
;        @blk_ref(HIGH,IAXIS)@  =>  blkLimits(HIGH,IAXIS)
blk_ref
