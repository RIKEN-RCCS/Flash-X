; Usage: @bx_mslice(Bx,MAGI_FACE_VAR,lbx(2)+1,ubx(2)+1,lbx(3),ubx(3),lbx(4),ubx(4))@
;     =>  Bx(MAGI_FACE_VAR,lbx(2)+1:ubx(2)+1,lbx(3):ubx(3),lbx(4):ubx(4))
bx_mslice
args=arr,var,i_lo,i_hi,j_lo,j_hi,k_lo,k_hi
definition=
   ${arr}(${var},${i_lo}:${i_hi},${j_lo}:${j_hi},${k_lo}:${k_hi})

; === Scratch array whole-array slice (4D: arr(VAR,:,:,:)) ===
; Usage: @scrch_aslice(scrchFaceXPtr,HY_P06_FACEXPTR_VAR)@  =>  scrchFaceXPtr(HY_P06_FACEXPTR_VAR,:,:,:)
