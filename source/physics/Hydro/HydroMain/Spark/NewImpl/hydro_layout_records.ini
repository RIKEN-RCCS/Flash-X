; A derived object per spatial location instead of a multidimensional variable array.
field_types
definition=
  type :: cell_record
    real(rk), allocatable :: q(:)
  end type
  type :: face_record
    real(rk), allocatable :: f(:,:)
  end type
  type :: cell_field
    type(cell_record), allocatable :: cells(:,:,:,:)
  end type
  type :: flux_field
    type(face_record), allocatable :: faces(:,:,:,:)
  end type
cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%cells(${ix},${jy},${kz},${block})%q(${var})
face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%faces(${ix},${jy},${kz},${block})%f(${var},${dir})
allocate_cell
args=data,nvar,lo,hi,nblock
scope=block
declarations=
  integer :: ai,aj,ak,ab
definition=
    allocate(data%cells(lo(1):hi(1),lo(2):hi(2),lo(3):hi(3),nblock))
    do ab=1,nblock
      do ak=lo(3),hi(3)
        do aj=lo(2),hi(2)
          do ai=lo(1),hi(1)
            allocate(data%cells(ai,aj,ak,ab)%q(nvar))
          end do
        end do
      end do
    end do
allocate_flux
args=data,nvar,lo,hi,ndim,nblock
scope=block
declarations=
  integer :: ai,aj,ak,ab
definition=
    allocate(data%faces(lo(1):hi(1),lo(2):hi(2),lo(3):hi(3),nblock))
    do ab=1,nblock
      do ak=lo(3),hi(3)
        do aj=lo(2),hi(2)
          do ai=lo(1),hi(1)
            allocate(data%faces(ai,aj,ak,ab)%f(nvar,ndim))
          end do
        end do
      end do
    end do
release_cell
args=data
definition=
  if (allocated(${data}%cells)) deallocate(${data}%cells)

release_flux
args=data
definition=
  if (allocated(${data}%faces)) &
    deallocate(${data}%faces)
