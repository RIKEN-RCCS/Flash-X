; Override the default reference and allocation macros. Same solver, different layout.
cell_ref
args=data,var,block,ix,jy,kz
definition=${data}%values(${ix},${jy},${kz},${block},${var})
face_ref
args=data,var,block,dir,ix,jy,kz
definition=${data}%values(${ix},${jy},${kz},${block},${dir},${var})
allocate_cell
args=data,nvar,lo,hi,nblock
definition=
  allocate(${data}%values(${lo}(1):${hi}(1),${lo}(2):${hi}(2), &
                         ${lo}(3):${hi}(3),${nblock},${nvar}))
allocate_flux
args=data,nvar,lo,hi,ndim,nblock
definition=
  allocate(${data}%values(${lo}(1):${hi}(1),${lo}(2):${hi}(2), &
                         ${lo}(3):${hi}(3),${nblock},${ndim},${nvar}))
