; Computational helpers: block scope and argument binding are supplied by the expander.

hy_allocateCell
args=data,nvar,lo,hi,nblock
scope=block
definition=
  @release_cell(data)@
  @allocate_cell(data,nvar,lo,hi,nblock)@

hy_allocateFlux
args=data,nvar,lo,hi,ndim,nblock
scope=block
definition=
  @release_flux(data)@
  @allocate_flux(data,nvar,lo,hi,ndim,nblock)@

hy_allocateWorkspace
args=work,lo,hi,nblock
scope=block
definition=
  @hy_allocateCell(work%flat,1,lo,hi,nblock)@
  @hy_allocateCell(work%minus,7,lo,hi,nblock)@
  @hy_allocateCell(work%plus,7,lo,hi,nblock)@
  work%lo=lo; work%hi=hi; work%blocks=nblock

hy_releaseWorkspace
args=work
scope=block
definition=
  @release_cell(work%flat)@
  @release_cell(work%minus)@
  @release_cell(work%plus)@
  work%lo=0; work%hi=-1; work%blocks=0

hy_loadHydroCell
args=data,inputMap,block,i,j,k,q
scope=block
declarations=
  integer :: v
definition=
  do v=1,7
    q(v)=@cell_ref(data,inputMap(v),block,i,j,k)@
  end do
  q(QEINT)=q(QRHO)*q(QEINT)

hy_flatteningAtCell
args=data,inputMap,block,i,j,k,ndim,params,f,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  integer :: d,e(3)
  real(rk) :: p,g,dp,b,z,a,fd,un,up
definition=
  status=HY_OK; f=1._rk
  if (.not.params%flattening) return
  p=@cell_ref(data,inputMap(QP),block,i,j,k)@
  g=@cell_ref(data,inputMap(QGAMMA),block,i,j,k)@
  if (.not.ieee_is_finite(p*g)) then
    status=HY_BAD_STATE; return
  end if
  if (p*g<=0._rk) then
    status=HY_BAD_STATE; return
  end if
  do d=1,ndim
    e=0; e(d)=1
    dp=abs(@cell_ref(data,inputMap(QP),block,i+e(1),j+e(2),k+e(3))@ - &
    @cell_ref(data,inputMap(QP),block,i-e(1),j-e(2),k-e(3))@)
    b=dp/max(params%flattening_eta, &
    abs(@cell_ref(data,inputMap(QP),block,i+2*e(1),j+2*e(2),k+2*e(3))@ - &
    @cell_ref(data,inputMap(QP),block,i-2*e(1),j-2*e(2),k-2*e(3))@))
    z=dp/(g*p)
    a=max(0._rk,min(1._rk,(0.85_rk-b)/0.10_rk))
    un=@cell_ref(data,inputMap(QUX+d-1),block,i,j,k)@
    up=@cell_ref(data,inputMap(QUX+d-1),block,i+e(1),j+e(2),k+e(3))@
    fd=1._rk
    if (up<un) fd=max(a,min(1._rk,(0.75_rk-z)/0.50_rk))
    f=min(f,fd)
  end do
  if (.not.ieee_is_finite(f)) status=HY_BAD_STATE

hy_computeFlattening
args=data,inputMap,block,lo,hi,ndim,params,flat,status
scope=block
declarations=
  integer :: i,j,k
  real(rk) :: f
definition=
  do k=lo(3),hi(3)
    do j=lo(2),hi(2)
      do i=lo(1),hi(1)
        @hy_flatteningAtCell(data,inputMap,block,i,j,k,ndim,params,f,status)@
        if (status/=HY_OK) return
        @flat_ref(flat,block,i,j,k)@=f
      end do
    end do
  end do
  status=HY_OK

hy_gatherStencil
args=data,inputMap,block,i,j,k,offset,quantity,stencil
scope=block
declarations=
  integer :: s,ii,jj,kk
definition=
  do s=-2,2
    ii=i+s*offset(1); jj=j+s*offset(2); kk=k+s*offset(3)
    stencil(s)=@cell_ref(data,inputMap(quantity),block,ii,jj,kk)@
    if (quantity==QEINT) stencil(s)=stencil(s)*@cell_ref(data,inputMap(QRHO),block,ii,jj,kk)@
  end do

hy_wenoZCandidatesAndWeights
args=q,epsilon,cm,cp,wm,wp
scope=block
declarations=
  real(rk) :: beta(3),correction(3),tau
definition=
  cp(1)=(2*q(-2)-7*q(-1)+11*q(0))/6._rk
  cp(2)=(-q(-1)+5*q(0)+2*q(1))/6._rk
  cp(3)=(2*q(0)+5*q(1)-q(2))/6._rk
  cm(1)=(-q(-2)+5*q(-1)+2*q(0))/6._rk
  cm(2)=(2*q(-1)+5*q(0)-q(1))/6._rk
  cm(3)=(11*q(0)-7*q(1)+2*q(2))/6._rk
  beta(1)=13._rk/12*(q(-2)-2*q(-1)+q(0))**2+0.25_rk*(q(-2)-4*q(-1)+3*q(0))**2
  beta(2)=13._rk/12*(q(-1)-2*q(0)+q(1))**2+0.25_rk*(q(-1)-q(1))**2
  beta(3)=13._rk/12*(q(0)-2*q(1)+q(2))**2+0.25_rk*(3*q(0)-4*q(1)+q(2))**2
  tau=abs(beta(1)-beta(3)); correction=1._rk+tau/(beta+epsilon)
  wp=[0.1_rk,0.6_rk,0.3_rk]*correction; wp=wp/sum(wp)
  wm=[0.3_rk,0.6_rk,0.1_rk]*correction; wm=wm/sum(wm)

hy_finishReconstruction
args=center,f,cm,cp,wm,wp,qm,qp
scope=block
definition=
  qm=f*dot_product(wm,cm)+(1._rk-f)*center
  qp=f*dot_product(wp,cp)+(1._rk-f)*center
  if ((qp-center)*(center-qm)<=0._rk) then
    qm=center; qp=center
  end if

hy_reconstructDirection
args=data,inputMap,block,lo,hi,offset,flat,params,minus,plus
scope=block
declarations=
  integer :: i,j,k,v
  real(rk) :: stencil(-2:2),cm(3),cp(3),wm(3),wp(3),qm,qp,f
definition=
  do k=lo(3),hi(3)
    do j=lo(2),hi(2)
      do i=lo(1),hi(1)
        f=@flat_ref(flat,block,i,j,k)@
        do v=1,7
          @hy_gatherStencil(data,inputMap,block,i,j,k,offset,v,stencil)@
          @hy_wenoZCandidatesAndWeights(stencil,params%weno_epsilon,cm,cp,wm,wp)@
          @hy_finishReconstruction(stencil(0),f,cm,cp,wm,wp,qm,qp)@
          @cell_ref(minus,v,block,i,j,k)@=qm
          @cell_ref(plus,v,block,i,j,k)@=qp
        end do
      end do
    end do
  end do

hy_assembleFaceStates
args=minus,plus,block,i,j,k,offset,ql,qr
scope=block
declarations=
  integer :: v
definition=
  do v=1,7
    ql(v)=@cell_ref(plus,v,block,i-offset(1),j-offset(2),k-offset(3))@
    qr(v)=@cell_ref(minus,v,block,i,j,k)@
  end do

hy_repairHydroState
args=q,params
scope=block
definition=
  q(QRHO)=max(params%density_floor,q(QRHO))
  q(QP)=max(params%pressure_floor,q(QP))

hy_estimateHydroWaveSpeeds
args=ql,qr,dir,params,sl,sr,speed,vacuum,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: al2,ar2
definition=
  status=HY_OK; vacuum=.false.; sl=0; sr=0; speed=0
  if (.not.all(ieee_is_finite(ql)) .or. .not.all(ieee_is_finite(qr))) then
    status=HY_BAD_STATE; return
  end if
  if (min(ql(QRHO),qr(QRHO),ql(QP),qr(QP))<=0._rk) then
    status=HY_BAD_STATE; return
  end if
  vacuum=min(ql(QRHO),qr(QRHO),ql(QP),qr(QP))<params%tiny_state
  if (vacuum) return
  al2=ql(QGAMMA)*ql(QP)/ql(QRHO); ar2=qr(QGAMMA)*qr(QP)/qr(QRHO)
  if (.not.ieee_is_finite(al2) .or. .not.ieee_is_finite(ar2)) then
    status=HY_BAD_STATE; return
  end if
  if (min(al2,ar2)<0._rk) then
    status=HY_BAD_STATE; return
  end if
  sl=min(ql(QUX+dir-1)-sqrt(al2),qr(QUX+dir-1)-sqrt(ar2))
  sr=max(ql(QUX+dir-1)+sqrt(al2),qr(QUX+dir-1)+sqrt(ar2))
  speed=max(abs(sl),abs(sr))

hy_primitiveToConservative
args=q,u
scope=block
definition=
  u(URHO)=q(QRHO); u(UMX:UMZ)=q(QRHO)*q(QUX:QUZ)
  u(UENER)=0.5_rk*q(QRHO)*sum(q(QUX:QUZ)**2)+q(QEINT)

hy_hydroPhysicalFlux
args=q,u,dir,f
scope=block
declarations=
  real(rk) :: un
definition=
  un=q(QUX+dir-1)
  f=u*un
  f(UMX+dir-1)=f(UMX+dir-1)+q(QP)
  f(UENER)=(u(UENER)+q(QP))*un

hy_computeHydroContact
args=ql,qr,dir,sl,sr,contact,pstar,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: unL,unR,leftMass,rightMass,denom
definition=
  status=HY_OK; contact=0; pstar=0
  unL=ql(QUX+dir-1); unR=qr(QUX+dir-1)
  leftMass=ql(QRHO)*(sl-unL); rightMass=qr(QRHO)*(sr-unR)
  denom=rightMass-leftMass
  if (denom==0._rk) then
    status=HY_DEGENERATE; return
  end if
  contact=(rightMass*unR-leftMass*unL+ql(QP)-qr(QP))/denom
  pstar=leftMass*(contact-unL)+ql(QP)
  if (.not.ieee_is_finite(contact) .or. .not.ieee_is_finite(pstar)) status=HY_BAD_STATE

hy_computeHydroStarState
args=q,u,dir,bound,contact,pstar,ustar,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: numer,denom,un
definition=
  status=HY_OK; ustar=0
  un=q(QUX+dir-1); numer=bound-un; denom=bound-contact
  if (denom==0._rk) then
    status=HY_DEGENERATE; return
  end if
  ustar(URHO)=q(QRHO)*numer/denom
  ustar(UMX:UMZ)=u(UMX:UMZ)*numer/denom
  ustar(UMX+dir-1)=ustar(URHO)*contact
  ustar(UENER)=(u(UENER)*numer+pstar*contact-q(QP)*un)/denom
  if (.not.all(ieee_is_finite(ustar))) status=HY_BAD_STATE

hy_selectHLLCFlux
args=ul,ur,usl,usr,fl,fr,sl,sr,contact,f
scope=block
definition=
  if (sl>=0._rk) then
    f=fl
  else if (contact>=0._rk) then
    f=fl+sl*(usl-ul)
  else if (sr>=0._rk) then
    f=fr+sr*(usr-ur)
  else
    f=fr
  end if

hy_selectHLLEFlux
args=ul,ur,fl,fr,sl,sr,f,status
scope=block
definition=
  status=HY_OK; f=0
  if (sl>0._rk) then
    f=fl
  else if (sr<0._rk) then
    f=fr
  else if (sr==sl) then
    status=HY_DEGENERATE
  else
    f=(sr*fl-sl*fr+sr*sl*(ur-ul))/(sr-sl)
  end if

hy_getFaceShock
args=data,shockVariable,block,i,j,k,offset,inShock
scope=block
definition=
  inShock=(@cell_ref(data,shockVariable,block,i,j,k)@/=0._rk .or. &
  @cell_ref(data,shockVariable,block,i-offset(1),j-offset(2),k-offset(3))@/=0._rk)

hy_viscosityCoefficient
args=ql,qr,dir,coefficient,nu
scope=block
definition=
  nu=coefficient*max(ql(QUX+dir-1)-qr(QUX+dir-1),0._rk)

hy_addFaceViscosity
args=data,inputMap,block,i,j,k,offset,dir,coefficient,f
scope=block
declarations=
  real(rk) :: ql(7),qr(7),ul(5),ur(5),nu
definition=
  if (coefficient==0._rk) return
  @hy_loadHydroCell(data,inputMap,block,i-offset(1),j-offset(2),k-offset(3),ql)@
  @hy_loadHydroCell(data,inputMap,block,i,j,k,qr)@
  @hy_viscosityCoefficient(ql,qr,dir,coefficient,nu)@
  @hy_primitiveToConservative(ql,ul)@
  @hy_primitiveToConservative(qr,ur)@
  f=f+nu*(ul-ur)

hy_emitFaceFlux
args=flux,outputMap,block,dir,i,j,k,f
scope=block
declarations=
  integer :: v
definition=
  do v=1,5
    @face_ref(flux,outputMap(v),block,dir,i,j,k)@=f(v)
  end do
