; Hydrodynamic Cartesian solution update. No EOS, species, or magnetic fields.
hy_loadUpdateConservative
args=state,map,block,i,j,k,u
scope=block
declarations=
  integer :: d
  real(rk) :: rho
definition=
  rho=@cell_ref(state,map(1),block,i,j,k)@
  u(1)=rho
  do d=1,3
    u(1+d)=rho*@cell_ref(state,map(1+d),block,i,j,k)@
  end do
  u(5)=rho*@cell_ref(state,map(5),block,i,j,k)@

hy_updateGravitySource
args=stage,gravity,map,block,i,j,k,enabled,source
scope=block
declarations=
  integer :: d
  real(rk) :: acceleration
definition=
  source=0._rk
  if (.not.enabled) return
  do d=1,3
    acceleration=@cell_ref(gravity,map(d),block,i,j,k)@
    source(1+d)=stage(1)*acceleration
    source(5)=source(5)+stage(1+d)*acceleration
  end do

hy_updateFluxDivergence
args=fluxX,fluxY,fluxZ,map,block,i,j,k,ndim,spacing,divergence
scope=block
declarations=
  integer :: v
definition=
  do v=1,5
    divergence(v)=(@face_ref(fluxX,map(v),block,1,i+1,j,k)@ - &
                   @face_ref(fluxX,map(v),block,1,i,j,k)@)/spacing(1)
    if (ndim>1) then
      divergence(v)=divergence(v)+(@face_ref(fluxY,map(v),block,2,i,j+1,k)@ - &
                                  @face_ref(fluxY,map(v),block,2,i,j,k)@)/spacing(2)
    end if
    if (ndim>2) then
      divergence(v)=divergence(v)+(@face_ref(fluxZ,map(v),block,3,i,j,k+1)@ - &
                                  @face_ref(fluxZ,map(v),block,3,i,j,k)@)/spacing(3)
    end if
  end do

hy_combineUpdate
args=reference,stage,source,divergence,coefficients,theta,updated
scope=block
definition=
  updated=coefficients(1)*reference+coefficients(2)*stage+theta*(source-divergence)

hy_recoverUpdatedHydro
args=updated,densityFloor,energyFloor,rho,velocity,totalEnergy,internalEnergy
scope=block
definition=
  rho=max(updated(1),densityFloor)
  velocity=updated(2:4)/rho
  totalEnergy=max(energyFloor,updated(5)/rho)
  internalEnergy=max(energyFloor,totalEnergy-0.5_rk*sum(velocity**2))

hy_extrapolatePotential
args=reference,previous,stage,coefficients,theta,dtOld,updated
scope=block
definition=
  updated=coefficients(1)*reference+coefficients(2)*stage+theta*(reference-previous)/dtOld

hy_storeUpdatedHydro
args=state,map,block,i,j,k,rho,velocity,totalEnergy,internalEnergy
scope=block
declarations=
  integer :: d
definition=
  @cell_ref(state,map(1),block,i,j,k)@=rho
  do d=1,3
    @cell_ref(state,map(1+d),block,i,j,k)@=velocity(d)
  end do
  @cell_ref(state,map(5),block,i,j,k)@=totalEnergy
  @cell_ref(state,map(6),block,i,j,k)@=internalEnergy
