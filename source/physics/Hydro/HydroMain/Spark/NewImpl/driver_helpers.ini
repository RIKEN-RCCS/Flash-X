; Preparation/storage operations, separated from the mesh provider.
hy_copyBlockState
args=source,destination,nVars,block,lo,hi
scope=block
declarations=
  integer :: i,j,k,v
definition=
  do k=lo(3),hi(3)
    do j=lo(2),hi(2)
      do i=lo(1),hi(1)
        do v=1,nVars
          @cell_ref(destination,v,block,i,j,k)@=@cell_ref(source,v,block,i,j,k)@
        end do
      end do
    end do
  end do

hy_uniformDtCellRate
args=state,map,block,i,j,k,nDim,spacing,sound,rate,speed,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  integer :: d
  real(rk) :: signal,velocity
definition=
  status=HY_BAD_STATE; rate=0._rk; speed=0._rk
  do d=1,nDim
    velocity=@cell_ref(state,map(1+d),block,i,j,k)@
    if (.not.ieee_is_finite(velocity)) return
    signal=abs(velocity)+sound
    rate=max(rate,signal/spacing(d)); speed=max(speed,signal)
  end do
  status=HY_OK

hy_accumulateStageFlux
args=flux,integrated,map,block,lo,hi,nDim,area,weight,dt,reset
scope=block
declarations=
  integer :: i,j,k,d,v,fhi(3)
  real(rk) :: contribution
definition=
  do d=1,nDim
    fhi=hi; fhi(d)=hi(d)+1
    do k=lo(3),fhi(3)
      do j=lo(2),fhi(2)
        do i=lo(1),fhi(1)
          do v=1,5
            contribution=weight*dt*area(d)*@face_ref(flux,map(v),block,d,i,j,k)@
            if (reset) then
              @face_ref(integrated,map(v),block,d,i,j,k)@=contribution
            else
              @face_ref(integrated,map(v),block,d,i,j,k)@= &
                @face_ref(integrated,map(v),block,d,i,j,k)@+contribution
            end if
          end do
        end do
      end do
    end do
  end do
