; Shared acoustic kernel. densityGuard=0 for dt; shock detection uses hy_tiny.
hy_acousticSpeed
args=state,map,block,i,j,k,densityGuard,sound,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: rho,p,g,a2
definition=
  status=HY_BAD_STATE; sound=0._rk
  rho=@cell_ref(state,map(1),block,i,j,k)@
  p=@cell_ref(state,map(5),block,i,j,k)@
  g=@cell_ref(state,map(6),block,i,j,k)@
  if (.not.all(ieee_is_finite([rho,p,g]))) return
  rho=max(rho,densityGuard)
  if (rho<=0._rk) return
  a2=g*p/rho
  if (.not.ieee_is_finite(a2)) return
  if (a2<0._rk) return
  sound=sqrt(a2); status=HY_OK

hy_shockNeighborhood
args=state,soundWork,map,block,i,j,k,ndim,minPressure,minSound
scope=block
declarations=
  integer :: ii,jj,kk,joff,koff
definition=
  joff=0; koff=0
  if (ndim>1) joff=1
  if (ndim>2) koff=1
  minPressure=huge(1._rk); minSound=huge(1._rk)
  do ii=i-1,i+1
    do jj=j-joff,j+joff
      do kk=k-koff,k+koff
        minPressure=min(minPressure,@cell_ref(state,map(5),block,ii,jj,kk)@)
        minSound=min(minSound,@flat_ref(soundWork,block,ii,jj,kk)@)
      end do
    end do
  end do

hy_shockDifferences
args=state,map,block,i,j,k,ndim,divVelocity,pressureGradient
scope=block
declarations=
  integer :: d,e(3)
definition=
  divVelocity=0._rk; pressureGradient=0._rk
  do d=1,ndim
    e=0; e(d)=1
    divVelocity=divVelocity+0.5_rk*( &
      @cell_ref(state,map(1+d),block,i+e(1),j+e(2),k+e(3))@ - &
      @cell_ref(state,map(1+d),block,i-e(1),j-e(2),k-e(3))@)
    pressureGradient=pressureGradient+abs(0.5_rk*( &
      @cell_ref(state,map(5),block,i+e(1),j+e(2),k+e(3))@ - &
      @cell_ref(state,map(5),block,i-e(1),j-e(2),k-e(3))@))
  end do

hy_classifyShock
args=minPressure,minSound,divVelocity,pressureGradient,beta,delta,marker
scope=block
definition=
  marker=0._rk
  if (pressureGradient>=beta*minPressure .and. divVelocity<=-delta*minSound) marker=1._rk

hy_dtCellMetrics
args=x,y,dx,dy,dz,cellLo,i,j,k,ndim,geometry,inverse,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: width(3)
definition=
  status=HY_BAD_INPUT; inverse=0._rk; width=1._rk
  width(1)=@line_ref(dx,cellLo(1))@
  if (ndim>1) width(2)=@line_ref(dy,cellLo(2))@
  if (ndim>2) width(3)=@line_ref(dz,cellLo(3))@
  if (geometry==DT_CYLINDRICAL .and. ndim>2) width(3)=@line_ref(x,i)@*@line_ref(dz,k)@
  if (geometry==DT_SPHERICAL) then
    if (ndim>1) width(2)=@line_ref(x,i)@*@line_ref(dy,j)@
    if (ndim>2) width(3)=@line_ref(x,i)@*sin(@line_ref(y,j)@)*@line_ref(dz,k)@
  end if
  if (.not.all(ieee_is_finite(width(1:ndim)))) return
  if (any(width(1:ndim)<=0._rk)) return
  inverse(1:ndim)=1._rk/width(1:ndim)
  status=HY_OK

hy_dtCellRate
args=state,map,block,i,j,k,ndim,uxgrid,uygrid,uzgrid,sound,inverse,rate,speed,status
scope=block
declarations=
  use, intrinsic :: ieee_arithmetic, only: ieee_is_finite
  real(rk) :: velocity(3),gridVelocity(3),signal
  integer :: d
definition=
  status=HY_BAD_STATE; rate=0._rk; speed=0._rk
  gridVelocity=0._rk
  gridVelocity(1)=@line_ref(uxgrid,i)@
  if (ndim>1) gridVelocity(2)=@line_ref(uygrid,j)@
  if (ndim>2) gridVelocity(3)=@line_ref(uzgrid,k)@
  do d=1,ndim
    velocity(d)=@cell_ref(state,map(1+d),block,i,j,k)@
  end do
  if (.not.all(ieee_is_finite(velocity(1:ndim)))) return
  if (.not.all(ieee_is_finite(gridVelocity(1:ndim)))) return
  do d=1,ndim
    signal=abs(velocity(d)-gridVelocity(d))+sound
    speed=max(speed,signal)
    rate=max(rate,signal*inverse(d))
  end do
  if (.not.ieee_is_finite(rate) .or. .not.ieee_is_finite(speed)) return
  status=HY_OK

hy_reduceDtRate
args=rate,speed,i,j,k,level,rank,maxRate,maxSpeed,location
scope=block
definition=
  maxSpeed=max(maxSpeed,speed)
  if (rate>maxRate) then
    maxRate=rate; location=[i,j,k,level,rank]
  end if

hy_commitDtLimit
args=maxRate,cfl,location,dtCheck,dtMinLoc
scope=block
declarations=
  real(rk) :: candidate
definition=
  candidate=huge(1._rk)
  if (maxRate>0._rk) candidate=cfl/maxRate
  if (candidate<dtCheck) then
    dtCheck=candidate; dtMinLoc=location
  end if
