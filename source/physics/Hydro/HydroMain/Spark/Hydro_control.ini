[hy_normalize_species]
args=hy_u
definition=
  hy_u(@M blk(HY_DENS,i,j,k)) = max(hy_smalldens, hy_u(@M blk(HY_DENS,i,j,k)))
  hy_u(@M blk(HY_PRES,i,j,k)) = max(hy_smallpres, hy_u(@M blk(HY_PRES,i,j,k)))
 #if NSPECIES>0
  spc(1:NSPECIES) = hy_u(@M blkrange(HY_NUM_VARS+1,HY_NUM_VARS+NSPECIES,i,j,k))
  do s=1,NSPECIES
     spc(s) = max(hy_smallX, min(1.0,spc(s)))
  end do
  spcSumInv = 1./sum(spc(1:NSPECIES))
  spc(1:NSPECIES) = spc(1:NSPECIES)*spcSumInv
  hy_u(@M blkrange(HY_NUM_VARS+1,HY_NUM_VARS+NSPECIES,i,j,k)) = spc(1:NSPECIES)
 #endif

[hy_globalFillGuardCells]
definition =
  if (.NOT.gcMaskLogged) then
     call Logfile_stampVarMask(hy_gcMask, .TRUE., '[Hydro]', 'gcReq')
  end if
  call Grid_fillGuardCells(CENTER, ALLDIR, doEos=.TRUE., eosMode=hy_eosModeGc, &
       maskSize=NUNK_VARS, mask=hy_gcMask, &
       makeMaskConsistent=.true., &
       selectBlockType=LEAF, &
       doLogMask=.NOT.gcMaskLogged)

