[hy_setLimits]
definition=
  ! based on each stage for telescoping update
  do stage = 1, MAXSTAGE
    ng = (MAXSTAGE-stage)*NSTENCIL
    limits(:,:,stage) = blkLimits(:,:)
    do dir=1,NDIM
       limits(LOW ,dir, stage) = blkLimits(LOW ,dir) - ng
       limits(HIGH,dir, stage) = blkLimits(HIGH,dir) + ng
    end do
  end do

[hy_updateState]
definition=
 #ifdef GPOT_VAR
  ! First reset GPOT_VAR.
  hy_starState(@M bounds(GPOT_VAR,0,0,0)) = &
       Uin(@M bounds(GPOT_VAR,0,0,0))
 #endif
  Uin(@M boundsall(0,0,0)) = &
       hy_starState(@M boundsall(0,0,0))

[hy_saveState]
definition=
  @M hy_DIR_parallel_loop_simd(3) &
  @M hy_DIR_private([v])
  @M loop_3d(blkLimitsGC,i,j,k)
      ! update temp vars with solution data
      do v=1,NUNK_VARS
         starState(@M blk(v,i,j,k))=Uin(@M blk(v,i,j,k))
         tmpState(@M blk(v,i,j,k))=Uin(@M blk(v,i,j,k))
      end do
  @M loop_end_3d

